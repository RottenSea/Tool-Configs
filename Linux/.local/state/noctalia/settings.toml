config_version = 13

[audio]
notification_sound = "/home/rottenth/.local/share/sounds/bigsur/stereo/message-attention.oga"
volume_change_sound = "/home/rottenth/.local/share/sounds/bigsur/stereo/message-attention.oga"

[bar.default]
auto_hide = true
background_opacity = 0.4999999888241291
center = [ "workspaces" ]
concave_edge_corners = false
end = [ "tray", "network", "bluetooth", "volume", "brightness", "battery", "clock", "clipboard", "notifications" ]
margin_ends = 0
padding = 10
position = "bottom"
reserve_space = false
shadow = false
start = [ "session", "launcher", "wallpaper", "media" ]
widget_spacing = 8

[battery]
warning_threshold = 30

[control_center]
show_shortcut_labels = false

[desktop_widgets]
enabled = false

[dock]
auto_hide = true
background_opacity = 0.79999998211860657
concave_edge_corners = false
enabled = true
icon_size = 32
launcher_icon = "navigation-filled"
launcher_position = "start"
position = "top"
reserve_space = false

[location]
address = "Lishui, China"

[lockscreen]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.79999998211860657
offset_y = 20

[osd]
background_opacity = 0.79999998211860657
position = "bottom_center"

[shell]
avatar_path = "/home/rottenth/Pictures/Avatar/3QkJdRcXpZ9HWL6.jpg"
font_family = "Maple Mono NL NF CN Medium"
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.launcher]
    categories = false
    compact = true

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    control_center_position = "center"
    open_near_click_session = true

    [shell.screenshot]
    confirm_region = true
    directory = "/home/rottenth/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "KP_1"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "KP_2"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "KP_3"
    variant = "destructive"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "KP_4"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "KP_5"
    variant = "default"

    [shell.shadow]
    alpha = 0.39999999105930328

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "fastfetch" ]

